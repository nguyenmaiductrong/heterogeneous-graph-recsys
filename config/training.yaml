data:
  data_dir: /content/data/
  node_counts:
    brand: 1919
    category: 14
    product: 29892
    user: 203063
  struct_dir: /content/data/node_mappings

model:
  dropout: 0.2
  embed_dim: 256
  n_layers: 3
  rank: 64
  use_grad_checkpoint: false
  n_intents: 64

sampler:
  hop1_budget: 16
  hop2_budget: 8
  hop1_sample_replace: true

loss:
  lambda_cl: 0.15
  tau: 0.1
  alpha: 0.5
  w_min: 0.05

# Regularization robust voi node it/khong co lich su — co che cua MO HINH de hoc
# tot tren toan bo du lieu (khong phai mot nhanh data pipeline rieng). lambda>0 bat
# distillation: forward phu lam thua lich su (ID-dropout p_id + history-dropout
# p_hist) duoc keo ve embedding day-du-lich-su (cosine); forward chinh giu nguyen.
low_history:
  p_id: 0.15        # xac suat thay self-embedding seed bang slot residual
  p_hist: 0.30      # xac suat xoa behavior edge cua seed user (mo phong thieu lich su)
  lambda_cold: 0.1  # 0 = tat distillation. Bat dau dropout-only roi tang dan.
  cold_every_k: 4   # chay forward phu moi K step. Tang 2->4 bu chi phi forward
                    # chinh tang khi temporal batching giu lai behavior edge
                    # (truoc day ref_time=min batch i.i.d. drop ~het edge).

training:
  amp: true
  use_bf16: true
  batch_size: 8192
  device: cuda
  epochs: 40
  eval_batch_size: 8192
  eval_every: 1
  eval_subsample: 20000
  eval_seed: 42
  seed: 42
  deterministic: false
  l2_lambda: 1.0e-05
  lr: 8.0e-04
  min_lr: 1.0e-06
  warmup_epochs: 3
  max_grad_norm: 1.0
  cl_every_k: 2
  max_view_triplets: 3000000
  num_neg: 32
  num_workers: 8
  patience: 5
  save_dir: checkpoints-final-l4
  weight_decay: 1.0e-02
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4

evaluation:
  full_ranking: true
  primary_metric: "NDCG@20"
  ks: [1, 5, 10, 20, 50]
  metrics: ["HR@1", "HR@5", "HR@10", "HR@20", "HR@50", "NDCG@1", "NDCG@5", "NDCG@10", "NDCG@20", "NDCG@50"]

wandb:
  artifact_name: bpatmp-final-l4
  enabled: true
  entity: nguyenmaiductrong37-h-c-vi-n-c-ng-ngh-b-u-ch-nh-vi-n-th-ng
  project: bpatmp-recsys
  run_name: bpatmp-final-l4
  save_every: 1

a100:
  allow_tf32: true
  cudnn_benchmark: true
  use_fused_adamw: true
  compile_model: false
  empty_cache_freq: 0
