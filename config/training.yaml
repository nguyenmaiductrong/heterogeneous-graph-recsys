data:
  data_dir: /content/data/
  node_counts:
    brand: 3470
    category: 14
    product: 100775
    user: 245778
  struct_dir: /content/data/node_mappings

model:
  dropout: 0.2
  embed_dim: 256
  n_layers: 3
  rank: 64
  use_grad_checkpoint: true  # 3 layer giu het activation -> OOM 40GB; checkpoint doi ~30% compute lay ~3x memory
  n_intents: 64

sampler:
  hop1_budget: 14   # 12 -> 14: warm underfit, them context vua phai (~17% canh/node)
                    # so voi 12; neu OOM ha ve 12 hoac giam batch_size. (16 = tran cao nhat)
  hop2_budget: 1    # moi product co DUNG 1 category + 1 brand (parquet 29892 dong / 29892 product);
                    # budget=8 with replacement chi tao 8 ban sao y het moi canh structural (~85% tong canh) -> x8 memory+time vo ich
  hop1_sample_replace: true

loss:
  lambda_cl: 0.10
  tau: 0.1
  alpha: 0.5
  w_min: 0.05

# Regularization robust voi node it/khong co lich su — co che cua MO HINH de hoc
# tot tren toan bo du lieu (khong phai mot nhanh data pipeline rieng). lambda>0 bat
# distillation: forward phu lam thua lich su (ID-dropout p_id + history-dropout
# p_hist) duoc keo ve embedding day-du-lich-su (cosine); forward chinh giu nguyen.
low_history:
  p_id: 0.15        # xac suat thay self-embedding seed bang slot residual
  p_hist: 0.20      # xac suat xoa behavior edge cua seed user (mo phong thieu lich su)
  lambda_cold: 0.05 # 0 = tat distillation. Bat dau dropout-only roi tang dan.
  # BPR truc tiep tren forward cold: cold user that = 0 canh train -> ca segment
  # dung chung MOT embedding (cold slot), metric cold = chat luong mot ranking
  # toan cuc. Distillation cosine khong toi uu ranking do nen khi item embedding
  # drift theo personalization, cold sap dan theo epoch (quan sat run v2).
  # lambda_bpr ep cold pathway rank purchase that len tren, bam theo item drift.
  lambda_bpr: 0.5
  cold_every_k: 4   # chay forward phu moi K step. Tang 2->4 bu chi phi forward
                    # chinh tang khi temporal batching giu lai behavior edge
                    # (truoc day ref_time=min batch i.i.d. drop ~het edge).

training:
  amp: true
  use_bf16: true
  batch_size: 8192
  device: cuda
  epochs: 40
  eval_batch_size: 8192
  eval_every: 1
  eval_subsample: 20000
  eval_seed: 42
  seed: 42
  deterministic: false
  l2_lambda: 1.0e-05
  # Val peak dung tai epoch ket thuc warmup (LR vua dat max) roi dung hoc =>
  # peak LR 5e-4 qua cao voi model nay; ha xuong 3e-4 + warmup ngan hon de
  # phan lon thoi gian train nam o vung LR on dinh + cosine decay co tac dung.
  lr: 3.0e-04
  min_lr: 1.0e-06
  warmup_epochs: 2
  max_grad_norm: 1.0
  cl_every_k: 2
  max_view_triplets: -1
  num_neg: 32
  # Hard negative: giam ty le hard (false-negative phi xa hon), pool rong hon,
  # va BO top-20 rank khoi pool — vung top chinh la noi future positive don vao
  # khi model kha len (khong the mask), BPR de chung xuong la pha truc tiep NDCG@10/20.
  neg_frac_hard: 0.3
  neg_hard_pool: 500
  neg_skip_top: 20
  num_workers: 8
  patience: 8   # warm NDCG con leo deu toi epoch 16 (underfit) -> 5 dung qua som
  save_dir: checkpoints-recsys-v5
  weight_decay: 1.0e-02
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  progress_bar: false
  quiet_checkpoint_logs: true

evaluation:
  full_ranking: true
  primary_metric: "NDCG@10"
  ks: [1, 5, 10, 20, 50]
  metrics: ["HR@1", "HR@5", "HR@10", "HR@20", "HR@50", "NDCG@1", "NDCG@5", "NDCG@10", "NDCG@20", "NDCG@50"]

wandb:
  artifact_name: recsys-graph-v5
  enabled: true
  entity: nguyenmaiductrong37-h-c-vi-n-c-ng-ngh-b-u-ch-nh-vi-n-th-ng
  project: recsys-graph
  run_name: recsys-graph-v5
  save_every: 1

a100:
  allow_tf32: true
  cudnn_benchmark: true
  use_fused_adamw: true
  compile_model: false
  empty_cache_freq: 0
